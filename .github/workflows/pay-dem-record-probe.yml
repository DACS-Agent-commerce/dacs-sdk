name: Read-only Demos record profile
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
jobs:
  record-profile:
    if: ${{ vars.DACS_RECORD_PROBE_CONFIRMED_JSON != '' && vars.DACS_RECORD_PROBE_NODE_COMMIT != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Read confirmed and optional failed records without a wallet
        env:
          DACS_RECORD_PROBE_CONFIRMED_JSON: ${{ vars.DACS_RECORD_PROBE_CONFIRMED_JSON }}
          DACS_RECORD_PROBE_NODE_COMMIT: ${{ vars.DACS_RECORD_PROBE_NODE_COMMIT }}
          DACS_RECORD_PROBE_FAILED_JSON: ${{ vars.DACS_RECORD_PROBE_FAILED_JSON }}
        run: |
          set -o pipefail
          node scripts/probe-pay-dem-record.mjs 2>&1 | tee record-profile.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: demos-record-profile
          path: record-profile.log
