name: Read-only Demos record profile
on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * *"
permissions:
  contents: read
jobs:
  record-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run build
      - name: Read confirmed and optional failed records without a wallet
        env:
          DACS_RECORD_PROBE_CONFIRMED_JSON: ${{ vars.DACS_RECORD_PROBE_CONFIRMED_JSON }}
          DACS_RECORD_PROBE_FAILED_JSON: ${{ vars.DACS_RECORD_PROBE_FAILED_JSON }}
        run: |
          set -o pipefail
          node scripts/probe-pay-dem-record.mjs 2>&1 | tee record-profile.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: demos-record-profile
          path: record-profile.log
