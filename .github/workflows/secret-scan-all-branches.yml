name: Secret scan (all branches)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan-all-branches:
    name: secret scan (all branches)
    # A fixed image generation; git, which decides what the scan sees, still comes from the image,
    # so the scan step first tests what this git and Gitleaks find.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pull request heads
        # The checkout fetches only branches and tags. GitHub keeps serving every pull request's
        # commits, closed and fork ones included, under refs/pull/<number>/head, so scan them too.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/pull/*/head'

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${download}" | sha256sum --check
          tar -xzf "$download" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          git --version

      - name: Scan all branch history
        # The options are the required scan's (see secret-scan.yml), with --all for HEAD: every
        # branch, tag and pull request head fetched above. The self-test and secret-scan.sh work
        # as there: an octopus merge, a path containing a newline or backslash or invalid
        # UTF-8 bytes, a git error or anything git writes to stderr fails the scan.
        env:
          LOG_OPTS: "--full-history --text --remerge-diff --all"
        run: |
          bash scripts/secret-scan-self-test.sh "$RUNNER_TEMP/gitleaks"
          bash scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" --redact=100 --no-banner
