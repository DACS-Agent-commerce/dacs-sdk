name: Secret scan (all branches)

on:
  schedule:
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan-all-branches:
    name: secret scan (all branches)
    # A fixed image generation; git, which decides what the scan sees, still comes from the image.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Fetch pull request heads
        # The checkout fetches only branches and tags. GitHub keeps serving every pull request's
        # commits, closed and fork ones included, under refs/pull/<number>/head, so scan them too.
        run: git fetch --no-tags origin '+refs/pull/*/head:refs/pull/*/head'

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${download}" | sha256sum --check
          tar -xzf "$download" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          git --version
          node --version

      - name: Scan all branch history
        id: scan
        # The options are the required scan's (see secret-scan.yml), with --all for HEAD: every
        # branch, tag and pull request head fetched above. Gitleaks logs a git error but still
        # passes, so git must first run the same log with no error and nothing on stderr.
        # The JSON report stays on the runner and is never uploaded.
        env:
          LOG_OPTS: "--full-history --text --remerge-diff --all"
        run: |
          if ! git log -p -U0 $LOG_OPTS > /dev/null 2> "$RUNNER_TEMP/git-log.err" || [ -s "$RUNNER_TEMP/git-log.err" ]; then
            cat "$RUNNER_TEMP/git-log.err"
            exit 1
          fi
          "$RUNNER_TEMP/gitleaks" git . --log-opts="$LOG_OPTS" --redact=100 --no-banner \
            --report-format=json --report-path="$RUNNER_TEMP/gitleaks-report.json"

      - name: List findings
        # Runs after a red scan too, so a new finding is visible in the step summary while the
        # job is already red for a known one. It reads only fingerprints, never secret values, and
        # prints each one's ID (a short digest), commit, rule and line, never the fingerprint or
        # its file name.
        if: ${{ !cancelled() && steps.scan.outcome != 'skipped' }}
        env:
          SCAN_OUTCOME: ${{ steps.scan.outcome }}
        run: node scripts/gitleaks-fingerprint-summary.mjs --report "$RUNNER_TEMP/gitleaks-report.json" --scan-outcome "$SCAN_OUTCOME"
