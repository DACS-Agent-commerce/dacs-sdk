name: Secret scan

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret scan
    # A fixed image generation; git, which decides what the scan sees, still comes from the image,
    # so the scan step first tests what this git and Gitleaks find.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 1

      - name: Fetch checked-out history
        # Fetch only this commit's ancestry, including both parents of a PR merge.
        # Pin the fetch to the event SHA so a moving ref cannot change the scan.
        run: git fetch --no-tags --unshallow origin "$GITHUB_SHA"

      - name: Install pinned Gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ARCHIVE_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          download="$RUNNER_TEMP/$archive"
          curl --fail --location --proto '=https' --tlsv1.2 \
            --output "$download" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "${GITLEAKS_ARCHIVE_SHA256}  ${download}" | sha256sum --check
          tar -xzf "$download" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version
          git --version

      - name: Scan reachable history
        # Gitleaks 8.30.1's default is `git log -p -U0 --full-history --all --diff-filter=tuxdb`;
        # --log-opts replaces everything after -U0, split at each space. Keep --full-history, swap
        # --all for HEAD, and:
        # - drop the diff filter: its lowercase `t` skips type changes, so a symlink turned into a
        #   regular file holding a secret would not be scanned;
        # - add --text: a path marked `-diff` in .gitattributes is otherwise a binary file, which
        #   Gitleaks skips;
        # - add --remerge-diff: otherwise a merge commit shows no patch, so a secret added by a
        #   conflict resolution, or by a merge that also changes files, would not be scanned. It
        #   shows only what the merge changed from git's own merge of its parents; -m would report
        #   every finding of a merged branch again under the merge commit. Needs git 2.36 or later.
        #   It skips a merge with more than two parents, so the scan refuses any octopus merge.
        # Gitleaks logs a git error but still passes, having scanned only what came before it, so
        # secret-scan.sh first runs the same log, and fails on a git error or anything on stderr
        # there or during Gitleaks' run, or if Gitleaks' own git log did not finish. It also hides
        # git's `remerge` lines from Gitleaks, which would otherwise drop some merges' commits
        # from their fingerprints, and refuses any path containing a newline, which git prints
        # unquoted in those lines, or containing a backslash or invalid UTF-8 bytes, which
        # Gitleaks cannot preserve in exact ignore entries or JSON fingerprints.
        # The self-test first runs both scripts on known history with
        # this git and Gitleaks, and fails unless Gitleaks reports exactly what it expects.
        env:
          LOG_OPTS: "--full-history --text --remerge-diff HEAD"
        run: |
          bash scripts/secret-scan-self-test.sh "$RUNNER_TEMP/gitleaks"
          bash scripts/secret-scan.sh "$RUNNER_TEMP/gitleaks" --redact=100 --no-banner
