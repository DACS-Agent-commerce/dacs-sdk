name: Registry-shaped Linux and Docker acceptance

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      enforce-audit-drift:
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/registry-container-acceptance.yml"
      - "package.json"
      - "package-lock.json"
      - "scripts/publish-exact-local-registry.mjs"
      - "scripts/registry-container-disposition.mjs"
      - "scripts/registry-container-audit-baseline.json"
      - "scripts/verify-registry-container-consumer.sh"
      - "scripts/verify-release-set.mjs"
      - "src/**"
      - "packages/dacs-node/**"
      - "packages/create-dacs-agent/**"

permissions:
  contents: read

jobs:
  registry-container-consumer:
    name: clean registry consumer (Node 20 / Docker)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20.19.1"

      - name: Pin acceptance npm client
        run: npm install --global --ignore-scripts npm@11.19.0

      - name: Install exact source lock
        run: npm ci

      - name: Run registry-shaped Linux and Docker acceptance
        # Exit 4 means the functional rehearsal passed and the release security
        # gate is blocked only by audit findings. Advisory-ID drift is
        # reported here and fails the scheduled/manual drift workflow.
        # Production publication stays blocked without failing
        # every pull request; any other failure, including exit 3, still fails.
        # Any command can exit 4 under set -e, so status 4 is waived only when
        # the written summary independently re-checks as audit-only.
        env:
          ENFORCE_AUDIT_DRIFT: ${{ inputs.enforce-audit-drift || false }}
        run: |
          status=0
          npm run acceptance:registry-container -- --output-dir registry-container-artifacts || status=$?
          if [ "$status" -eq 4 ]; then
            summary=registry-container-artifacts/acceptance-summary.json
            disposition=1
            if test -f "$summary"; then
              disposition=0
              node scripts/registry-container-disposition.mjs "$summary" || disposition=$?
            fi
            if [ "$disposition" -ne 4 ]; then
              echo "::error title=Registry/container acceptance failed::Exit 4 was not produced by a audit-only acceptance summary (summary disposition: $disposition)."
              exit "$status"
            fi
            echo "::warning title=#191 security gate blocked::Release security gate remains blocked by audit findings; unlisted advisory IDs are reported separately. See acceptance-summary.json."
            if [ "${ENFORCE_AUDIT_DRIFT:-false}" = true ]; then
              node scripts/registry-container-disposition.mjs --audit-drift "$summary"
            fi
            exit 0
          fi
          exit "$status"

      - name: Publish acceptance summary
        if: always()
        run: |
          if test -f registry-container-artifacts/acceptance-summary.json; then
            echo '## Registry-shaped consumer acceptance' >> "$GITHUB_STEP_SUMMARY"
            cat registry-container-artifacts/acceptance-summary.json >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload registry/container evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dacs-registry-container-${{ github.sha }}
          path: registry-container-artifacts/
          if-no-files-found: warn
          retention-days: 30
