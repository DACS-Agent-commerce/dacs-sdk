                throw new Error(`pay-dem consumer contains ${name}`);
              }
            }
            rejectConfig(["DACS_X402_", "DACS_EVM_", "DACS_FIXED_PRICE_AMOUNT", "DACS_MAX_EVM_"]);
          } else {
