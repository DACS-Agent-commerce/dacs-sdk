name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Test the minimum declared engine (^20.19.0 floor) AND a current LTS, so
        # a floating "20" can never hide a tooling requirement above the floor (#44).
        node-version: ["20.19.0", "22"]
    name: build-test (node ${{ matrix.node-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      - name: Sync DACS-Standard conformance vectors
        run: npm run conformance:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck Node host kit
        run: npm run host:typecheck

      - name: Build
        run: npm run build

      - name: Build Node host kit
        run: npm run host:build

      - name: Package smoke (core install without live peers)
        run: |
          mkdir -p package-smoke/app
          npm pack --pack-destination package-smoke
          npm install --prefix package-smoke/app --omit=optional --ignore-scripts "$GITHUB_WORKSPACE"/package-smoke/*.tgz
          (cd package-smoke/app && node -e "Promise.all([import('@kynesyslabs/dacs'), import('@kynesyslabs/dacs/seller'), import('@kynesyslabs/dacs/commerce')]).then(([root, seller, commerce]) => { if (typeof root.verifyBundleCore !== 'function' || typeof seller.verifySellerPaymentIntake !== 'function' || typeof seller.runFulfilmentCore !== 'function' || typeof root.runDurableFulfilmentCore !== 'function' || typeof seller.runDurableFulfilmentCore !== 'function' || typeof root.runDurableFulfilmentToDeliveryReady !== 'function' || typeof seller.runDurableFulfilmentToDeliveryReady !== 'function' || typeof root.advanceDeliveryFinalisation !== 'function' || typeof seller.advanceDeliveryFinalisation !== 'function' || typeof root.resumeDeliveryFinalisation !== 'function' || typeof seller.resumeDeliveryFinalisation !== 'function' || typeof root.getDeliveryFinalisationStatus !== 'function' || typeof seller.getDeliveryFinalisationStatus !== 'function' || typeof root.createInMemoryFencedSessionStore !== 'function' || typeof root.createFsFencedSessionStore !== 'function' || seller.createInMemoryFencedSessionStore !== root.createInMemoryFencedSessionStore || root.FENCED_SESSION_STORE_VERSION !== 2 || seller.FENCED_SESSION_STORE_VERSION !== 2 || root.SESSION_STORE_VERSION !== 1 || typeof commerce.createFixedPriceX402BuyerCoordinator !== 'function' || commerce.createFixedPriceX402BuyerCoordinator !== root.createFixedPriceX402BuyerCoordinator || typeof commerce.createBuyerPaymentEvidenceHandshake !== 'function') process.exit(1) })")
          npm audit --prefix package-smoke/app --omit=dev --omit=optional

      - name: Package smoke (Node host kit boundary)
        run: |
          mkdir -p host-package-smoke/app
          npm pack --pack-destination host-package-smoke
          npm pack --workspace @kynesyslabs/dacs-node --pack-destination host-package-smoke
          npm install --prefix host-package-smoke/app --ignore-scripts \
            "$GITHUB_WORKSPACE"/host-package-smoke/kynesyslabs-dacs-0.1.0-alpha.0.tgz \
            "$GITHUB_WORKSPACE"/host-package-smoke/kynesyslabs-dacs-node-0.1.0-alpha.0.tgz
          (cd host-package-smoke/app && node -e "Promise.all([import('@kynesyslabs/dacs'), import('@kynesyslabs/dacs-node'), import('@kynesyslabs/dacs-node/transport')]).then(([core, host, transport]) => { if (typeof core.createFixedPriceOfflineBuyerCoordinator !== 'function' || typeof host.validateDacsAgentConfig !== 'function' || typeof transport.createDacsHttpEnvelopeV1 !== 'function') process.exit(1) })")
          node -e "const p=require('./package.json'); if ((p.dependencies && p.dependencies['@kynesyslabs/dacs-node']) || (p.optionalDependencies && p.optionalDependencies['@kynesyslabs/dacs-node']) || (p.peerDependencies && p.peerDependencies['@kynesyslabs/dacs-node'])) process.exit(1)"

      - name: Test (unit + conformance harness)
        run: npm test

      - name: Test Node host kit
        run: npm run host:test

      # Informational (non-blocking): surface production-tree advisories per the
      # SECURITY.md audit policy (#40). continue-on-error keeps the JOB green, but
      # the step's own status is NOT swallowed with `|| true` — a non-zero audit
      # shows as a ⚠️ on the step, and a compact summary is published to the run.
      - name: Dependency audit (production, informational)
        continue-on-error: true
        run: |
          npm audit --omit=dev --json > audit.json || true
          node -e '
            const a = require("./audit.json");
            const m = (a.metadata && a.metadata.vulnerabilities) || {};
            const v = a.vulnerabilities || {};
            // OWN advisory = a `via` object on a direct dep (not a severity inherited
            // from its subtree). This is what SECURITY.md tracks as fixable-here.
            const ownDirect = Object.values(v).filter(x =>
              x.isDirect && (x.via || []).some(e => typeof e === "object"));
            const rows = ["| severity | count |", "| --- | --- |"]
              .concat(["critical","high","moderate","low"].map(s => `| ${s} | ${m[s] ?? 0} |`));
            const out = [
              "### Production dependency audit (informational)",
              "",
              ...rows,
              "",
              `Direct dependencies with their OWN advisory: **${ownDirect.length}**. ` +
              `Live integration peers are audited by applications that install them; see SECURITY.md.`,
            ].join("\n");
            require("fs").appendFileSync(process.env.GITHUB_STEP_SUMMARY || "/dev/stdout", out + "\n");
          '
          # Re-run without masking so the step reflects the real audit status.
          npm audit --omit=dev

      # Blocking gate: fail ONLY on a high/critical advisory a DIRECT dependency
      # carries ITSELF. A direct dep's `severity` is inherited from its subtree via
      # `via` edges, so severity alone flags demosdk/viem for their transitive tree
      # (covered by SECURITY.md). An OWN advisory is a `via` OBJECT on the node — a
      # new one here means a direct dependency we must fix directly.
      - name: Fail on direct-dependency high/critical advisories
        run: |
          # `|| true` keeps a non-zero audit exit (findings exist) from aborting the
          # step before we parse — but a TOTAL audit failure is caught below, not
          # swallowed, so a registry/network error can't pass the gate silently.
          npm audit --omit=dev --json > audit.json || true
          node -e '
            let a;
            try { a = require("./audit.json"); } catch { a = null; }
            // A completed audit always carries a metadata.vulnerabilities block.
            // Its absence means the audit did not run to completion — FAIL CLOSED
            // rather than treat a missing/garbage report as "no advisories".
            if (!a || !a.metadata || !a.metadata.vulnerabilities) {
              console.error("dependency audit did not produce a valid report; failing closed");
              process.exit(1);
            }
            const v = a.vulnerabilities || {};
            const bad = [];
            for (const [name, node] of Object.entries(v)) {
              if (!node.isDirect) continue;
              for (const via of node.via || []) {
                if (typeof via === "object" && (via.severity === "high" || via.severity === "critical")) {
                  bad.push(`${name}: ${via.title || via.url} (${via.severity})`);
                }
              }
            }
            if (bad.length) {
              console.error("Direct-dependency high/critical advisories:\n  " + bad.join("\n  "));
              process.exit(1);
            }
            console.log("No high/critical advisory on any direct dependency.");
          '
