name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Sync DACS-Standard conformance vectors
        run: npm run conformance:sync

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test (unit + conformance harness)
        run: npm test

      # Informational only (non-blocking): surface production-tree advisories per
      # the SECURITY.md audit policy (#40) without gating unrelated work — the
      # findings are transitive through @kynesyslabs/demosdk, assessed by reachability.
      - name: Dependency audit (production, informational)
        run: npm audit --omit=dev || true
        continue-on-error: true
