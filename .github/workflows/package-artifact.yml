name: Package artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    name: reproducible package + Bun consumer
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Build, pack, and verify artifact
        run: npm run package:verify -- --output-dir package-artifacts

      - name: Upload exact package and provenance
        uses: actions/upload-artifact@v4
        with:
          name: dacs-sdk-package-${{ github.sha }}
          path: package-artifacts/
          if-no-files-found: error
          retention-days: 30
