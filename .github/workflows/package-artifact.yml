name: Package artifact

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-artifact:
    runs-on: ubuntu-latest
    name: reproducible package + Bun consumer
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.21.1"

      - name: Pin release npm client
        run: npm install --global --ignore-scripts npm@11.19.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: npm ci

      - name: Build, pack, and verify artifact
        run: npm run package:lifecycle:verify

      - name: Build, pack, and verify reproducible root artifact
        run: |
          mkdir package-artifacts
          npm run package:verify -- --output-dir package-artifacts/core

      - name: Verify exact release set, provenance, checksums and SBOMs
        run: npm run release:set:verify -- --output-dir package-artifacts/release-set

      - name: Upload exact package and provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dacs-sdk-package-${{ github.sha }}
          path: package-artifacts/
          if-no-files-found: error
          retention-days: 30
