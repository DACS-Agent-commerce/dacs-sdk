name: demosdk compatibility

# This daily workflow typechecks and tests demosdk 4.0.18 (the demosdk-pinned-tests job; ci.yml no longer does),
# detects new in-range releases before another PR arrives
# (the demosdk-pin-drift job, scheduled runs only, so it never blocks a PR)
# and adds build/declaration emit at 4.0.18 and the newest in-range release.
# Its PR runs cover changes to this workflow or dependency configuration only;
# source changes get the 4.0.18 checks on the next daily run after they reach the default branch
# (scheduled runs use the default branch only).
# When bumping the pinned demosdk, update demosdk-pinned-tests; update the matrix entry here too.
# The demosdk-pin-drift job also passes the pinned version to scripts/demosdk-pin-drift.mjs.

on:
  schedule:
    - cron: "23 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/demosdk-compat.yml"
      - "package.json"
      - "package-lock.json"

permissions:
  contents: read

jobs:
  demosdk-pin-drift:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    name: newer in-range demosdk than the pinned version
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      # Keep 4.0.18 equal to the version pinned in demosdk-pinned-tests below.
      - name: Compare the pinned version with the newest in-range release
        run: node scripts/demosdk-pin-drift.mjs 4.0.18 "$(node -p "require('./package.json').peerDependencies['@kynesyslabs/demosdk']")"

  demosdk-compat:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        demosdk: ["locked", "4.0.18", "newest-in-range"]
    name: typecheck + build (demosdk ${{ matrix.demosdk }})
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22.22.2"

      - name: Record compatibility environment
        run: |
          {
            echo "Runner: $RUNNER_OS $RUNNER_ARCH; image $ImageOS $ImageVersion"
            cat /etc/os-release
            uname -r
            node --version
            npm --version
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install locked dependencies
        # Typecheck and build need no install scripts.
        run: npm ci --no-audit --ignore-scripts

      - name: Install demosdk ${{ matrix.demosdk }} without saving
        if: matrix.demosdk != 'locked'
        env:
          DEMOSDK: ${{ matrix.demosdk }}
        run: |
          if [ "$DEMOSDK" = "newest-in-range" ]; then
            # The peer range is the published contract; dev must match it.
            # version.test.ts separately pins the lockfile to the range floor.
            spec="$(node -p "require('./package.json').peerDependencies['@kynesyslabs/demosdk']")"
            dev="$(node -p "require('./package.json').devDependencies['@kynesyslabs/demosdk']")"
            if [ "$spec" != "$dev" ]; then
              echo "demosdk peer range $spec differs from dev range $dev" >&2
              exit 1
            fi
          else
            spec="$DEMOSDK"
          fi
          npm install --no-save --no-audit --ignore-scripts "@kynesyslabs/demosdk@${spec}"
          git diff --exit-code -- package.json package-lock.json

      - name: Check the resolved demosdk version
        env:
          DEMOSDK: ${{ matrix.demosdk }}
        run: |
          resolved="$(node -p "require('./node_modules/@kynesyslabs/demosdk/package.json').version")"
          echo "demosdk resolved: $resolved"
          echo "demosdk ${DEMOSDK}: resolved ${resolved}" >> "$GITHUB_STEP_SUMMARY"
          case "$DEMOSDK" in
            locked)
              expected="$(node -p "require('./package-lock.json').packages['node_modules/@kynesyslabs/demosdk'].version")"
              ;;
            newest-in-range)
              # The newest release the registry lists in the published peer
              # range, read independently of the install that resolved it.
              spec="$(node -p "require('./package.json').peerDependencies['@kynesyslabs/demosdk']")"
              expected="$(npm view "@kynesyslabs/demosdk@${spec}" version --json | node -e '
                const versions = [].concat(JSON.parse(require("fs").readFileSync(0, "utf8")));
                const parts = (v) => v.split(/[.+-]/, 3).map(Number);
                versions.sort((a, b) => {
                  const [x, y] = [parts(a), parts(b)];
                  return x[0] - y[0] || x[1] - y[1] || x[2] - y[2];
                });
                console.log(versions.at(-1));
              ')"
              ;;
            *)
              expected="$DEMOSDK"
              ;;
          esac
          echo "demosdk expected: $expected"
          test "$resolved" = "$expected"

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  # The locked demosdk 4.0.16 declarations do not resolve with NodeNext, so its NetworkInfo/AddressInfo and web2 types
  # are `any` in ci.yml's checks. 4.0.18 resolves them; this job typechecks and runs the demosdk-related tests against
  # it. It checks exactly 4.0.18 and never looks up the newest release (the pinned install itself still needs
  # the registry). It runs daily, on manual runs and on pull requests that change this workflow or the dependency
  # files, so a break against 4.0.18 shows up to a day after it reaches the default branch (scheduled runs use the
  # default branch only). The demosdk-pin-drift job above reports newer
  # releases in ^4.0.16 (scripts/demosdk-pin-drift.mjs); the PR that acts on that report replaces every 4.0.18 in this
  # file with the new version and fixes what then fails.
  demosdk-pinned-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: typecheck + tests (demosdk 4.0.18)
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm ci --no-audit

      - name: Sync DACS-Standard conformance vectors
        run: npm run conformance:sync

      - name: Build
        run: npm run build

      # The client tests import @kynesyslabs/dacs-node/demos-loader, which is dist/demosLoader.js.
      - name: Build Node host kit
        run: npm run host:build

      # Last step: it replaces the installed SDK for the rest of this job.
      - name: Typecheck and test against demosdk 4.0.18
        run: |
          npm install --no-save --no-audit --ignore-scripts @kynesyslabs/demosdk@4.0.18
          test "$(node -p "require('./node_modules/@kynesyslabs/demosdk/package.json').version")" = "4.0.18"
          npm run typecheck
          npm run host:typecheck
          npx vitest run test/substrate/demos-adapter.test.ts test/rails/payDem-adapter.test.ts test/rails/payDem.test.ts test/agent/settlementFailure.test.ts
          # Every client file this area promises under 4.0.18, named one by one; later changes append theirs. No glob selects one.
          node --test --test-concurrency=1 packages/dacs-client/test/node-demos-loading.test.mjs packages/dacs-client/test/node-wallet-demosdk.test.mjs packages/dacs-client/test/node-wallet-final-content.test.mjs packages/dacs-client/test/node-wallet-fresh-child.test.mjs packages/dacs-client/test/node-wallet-observer.test.mjs packages/dacs-client/test/node-wallet-source-reads.test.mjs packages/dacs-client/test/node-wallet-packed.test.mjs
          node --test packages/dacs-client/test/delta-ledger-gate.test.mjs
